<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuyo - Cuenta creada</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0fdf4; display: flex;
           justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; border-radius: 16px; padding: 40px 32px; max-width: 360px;
            text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .check { font-size: 56px; } h1 { font-size: 22px; color: #166534; margin: 12px 0 8px; }
    p { color: #555; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    .btn { display: inline-block; background: #16a34a; color: white; text-decoration: none;
           padding: 12px 28px; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>¡Usuario creado correctamente!</h1>
    <p>Tu cuenta de Yuyo ya está confirmada.<br>Ya podés volver a la app e iniciar sesión.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.dae.yuyo">Volver a Yuyo</a>
  </div>
</body>
</html>
